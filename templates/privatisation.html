<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snack and Surf - Privatisation</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    
    <nav class="bg-white shadow-md fixed w-full z-20 top-0">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-blue-600">🏄‍♂️ Snack & Surf</a>
            <ul class="flex space-x-6 text-sm font-semibold">
                <li><a href="/" class="hover:text-blue-500">Accueil & Carte</a></li>
            </ul>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto px-4 py-24 mt-10">
        <h1 class="text-4xl font-extrabold text-blue-600 text-center mb-6">Privatisez le Snack & Surf</h1>
        <p class="text-center text-gray-600 mb-10 text-lg">Anniversaires, afterworks, pots de départ... Réservez notre espace face à la mer (jusqu'à 30 personnes).</p>

        {% if succes %}
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-8 text-center" role="alert">
            <strong class="font-bold">Demande envoyée !</strong>
            <span class="block sm:inline"> Nous vous recontacterons très vite pour confirmer les détails.</span>
        </div>
        {% endif %}

        <form method="POST" class="bg-white p-8 rounded-lg shadow-lg">
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2">Nom / Entreprise</label>
                <input type="text" name="nom" class="border p-3 w-full rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2">Email ou Numéro de téléphone</label>
                <input type="text" name="email" class="border p-3 w-full rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Date souhaitée</label>
                    <input type="date" name="date" class="border p-3 w-full rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Nombre de personnes</label>
                    <input type="number" name="personnes" min="1" max="30" class="border p-3 w-full rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 font-bold mb-2">Type d'événement</label>
                <select name="type" class="border p-3 w-full rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Anniversaire">Anniversaire</option>
                    <option value="Afterwork">Afterwork</option>
                    <option value="Pot de depart">Pot de départ</option>
                    <option value="Autre">Autre</option>
                </select>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 font-bold mb-2">Message supplémentaire <span class="text-gray-400 font-normal text-sm">(Facultatif)</span></label>
                <textarea name="message" rows="3" class="border p-3 w-full rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Une demande particulière ? Laissez-nous un mot ici..."></textarea>
            </div>

            <button type="submit" class="bg-blue-600 text-white font-bold py-3 px-6 rounded-full w-full hover:bg-blue-700 transition">Envoyer la demande</button>
        </form>
    </div>
</body>
</html>

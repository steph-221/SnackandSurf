<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snack and Surf | Restaurant de plage & Burgers - Almadies, Dakar</title>
    <meta name="description" content="Snack de plage aux Almadies a Dakar. Degustez nos burgers maison, hot-dogs crispy, crepes et smoothies face a l'ocean. Privatisation jusqu'a 30 personnes.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        :root {
            --senegal-green: #00853F;
            --senegal-yellow: #FDEF42;
            --senegal-red: #E31B23;
            --text-dark: #1a1a1a;
            --text-muted: #555555;
        }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #e0f7fa 0%, #80deea 100%); background-attachment: fixed; min-height: 100vh; color: var(--text-dark); padding-bottom: 80px; }
        .main-title { font-family: 'Permanent Marker', cursive; text-shadow: 2px 2px 0px var(--senegal-green); color: var(--senegal-red); transform: rotate(-2deg); }
        .card { background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0, 133, 63, 0.15); padding: 2rem 1.5rem; margin: 2rem auto; max-width: 750px; border: 2px solid #fff; position: relative; overflow: hidden; }
        .card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 12px; background: repeating-linear-gradient(90deg, var(--senegal-green), var(--senegal-green) 33.3%, var(--senegal-yellow) 33.3%, var(--senegal-yellow) 66.6%, var(--senegal-red) 66.6%, var(--senegal-red) 100%); }
        .section-title { font-family: 'Permanent Marker', cursive; position: relative; color: var(--senegal-green); font-size: 2rem; padding-bottom: 1rem; display: flex; align-items: center; justify-content: center; margin-top: 2rem; }
        .section-title::after { content: ''; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 80px; height: 4px; background-color: var(--senegal-yellow); border-radius: 2px; box-shadow: 0 2px 0 var(--senegal-red); }
        .menu-item-block { padding-top: 0.75rem; border-bottom: 1px dashed #ccc; padding-bottom: 0.5rem;}
        .item-row { display: flex; justify-content: space-between; align-items: flex-end; }
        .item-name-dots { display: flex; flex-grow: 1; overflow: hidden; align-items: flex-end; }
        .dots-separator { flex-grow: 1; min-width: 10px; margin: 0 0.5rem; border-bottom: 2px dotted #aaa; height: 1em; }
        .item-name { font-weight: 700; color: #222; font-size: 1.1rem; line-height: 1.4; display: block; flex-shrink: 1; }
        .item-price { font-family: 'Permanent Marker', cursive; color: var(--senegal-red); font-size: 1.25rem; flex-shrink: 0; margin-left: 1rem; }
        .item-ingredients { color: var(--text-muted); font-style: italic; font-size: 0.9rem; margin-top: 0.25rem; margin-bottom: 0.75rem; padding-left: 0.5rem; line-height: 1.3; }
        
        .btn-add {
            background-color: var(--senegal-green); color: white; border: none; border-radius: 50%; width: 28px; height: 28px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
            margin-left: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: transform 0.1s;
        }
        .btn-add:active { transform: scale(0.9); }

        /* Le bandeau du panier en bas */
        #cart-bar {
            position: fixed; bottom: 0; left: 0; right: 0; background-color: #25D366; color: white;
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1); z-index: 100; transform: translateY(100%); transition: transform 0.3s ease-out;
            cursor: pointer;
        }
        #cart-bar.visible { transform: translateY(0); }

        /* Fenêtre modale du détail du panier */
        #cart-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5);
            z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        #cart-modal.visible { display: flex; }
        .cart-content { background: white; width: 100%; max-w: 500px; border-radius: 1rem; padding: 20px; max-height: 80vh; overflow-y: auto; color: #333; }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div class="fixed top-4 left-4 z-50 flex gap-2">
        <a href="/admin" class="bg-gray-800 text-white text-xs font-bold px-3 py-2 rounded opacity-50 hover:opacity-100 transition">Admin</a>
        <a href="/privatisation" class="bg-blue-600 text-white text-xs font-bold px-3 py-2 rounded shadow-md">Privatiser</a>
    </div>

    <header class="text-center mb-6 mt-8">
        <h1 class="main-title text-5xl sm:text-6xl font-extrabold tracking-wider relative inline-block">LA CARTE</h1>
        <p class="text-xs uppercase tracking-widest text-emerald-800 font-bold mt-2">Route de la Corniche, Les Almadies - Dakar</p>
    </header>

    <main class="card">
        <div class="w-full flex justify-center mb-8 pt-4">
            <img src="https://drive.google.com/thumbnail?id=1ffuCBqJBhUMZF1akm5_CL7_txgfaJF2m&sz=w1000" alt="Snack and Surf Logo" class="max-w-[250px] sm:max-w-[300px] h-auto drop-shadow-md">
        </div>

        <div id="dynamic-menu-container"></div>
    </main>

    <!-- BANDEAU PANIER -->
    <div id="cart-bar" onclick="toggleCartModal()">
        <div class="flex items-center gap-3">
            <div class="bg-white text-green-600 font-bold rounded-full w-8 h-8 flex items-center justify-center" id="cart-count">0</div>
            <span class="font-bold">Voir mon panier</span>
        </div>
        <div class="font-extrabold text-xl"><span id="cart-total">0</span> FCFA</div>
    </div>

    <!-- MODAL PANIER DETAILLE -->
    <div id="cart-modal">
        <div class="cart-content shadow-2xl relative">
            <button onclick="toggleCartModal()" class="absolute top-4 right-4 text-gray-500 font-bold text-xl">×</button>
            <h2 class="text-2xl font-bold mb-6 text-green-600 border-b pb-2">Ma Commande</h2>
            
            <div id="cart-items-list" class="mb-6 space-y-3">
                <!-- Les articles du panier apparaitront ici -->
            </div>
            
            <div class="border-t pt-4 flex justify-between items-center mb-6">
                <span class="text-lg font-bold">Total :</span>
                <span class="text-2xl font-extrabold text-red-600"><span id="modal-cart-total">0</span> FCFA</span>
            </div>

            <button onclick="sendOrderToWhatsApp()" class="w-full bg-[#25D366] hover:bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 text-lg">
                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.599 2.679-.702c.97.529 1.838.783 2.78.783h.001c3.182 0 5.768-2.587 5.769-5.766.001-3.182-2.585-5.767-5.769-5.767zm7.551 5.766c-.001 4.165-3.39 7.554-7.553 7.554-1.259 0-2.438-.328-3.486-.902l-4.543 1.19 1.213-4.431c-.655-1.084-1.024-2.353-1.024-3.411.001-4.165 3.39-7.554 7.553-7.554 4.164 0 7.553 3.389 7.554 7.554zm-4.708 2.062c-.21-.105-1.242-.613-1.434-.683-.193-.07-.333-.105-.473.105-.14.21-.543.683-.666.823-.122.14-.245.158-.455.053-.21-.105-.888-.327-1.691-1.043-.625-.558-1.047-1.247-1.17-1.457-.122-.21-.013-.324.092-.428.095-.094.21-.245.315-.368.105-.123.14-.21.21-.35.07-.14.035-.263-.018-.368-.053-.105-.473-1.14-.648-1.56-.17-.41-.344-.354-.473-.36-.122-.006-.263-.007-.403-.007-.14 0-.368.053-.56.263-.193.21-.736.719-.736 1.753s.753 2.033.858 2.173c.105.14 1.482 2.263 3.59 3.173.501.217.892.346 1.197.443.503.16 1.012.137 1.393.08.425-.064 1.242-.508 1.417-.999.175-.49.175-.91.122-.999-.052-.088-.192-.14-.402-.245z"/></svg>
                Envoyer ma commande
            </button>
            <button onclick="clearCart()" class="w-full mt-3 text-red-500 font-bold text-sm underline">Vider le panier</button>
        </div>
    </div>

    <!-- LOGIQUE JAVASCRIPT DU PANIER -->
    <script>
        let cart = {};
        
        function parsePrice(priceStr) {
            // Transforme "4 000 FCFA" en entier 4000
            return parseInt(priceStr.replace(/\D/g, ''));
        }

        function addToCart(id, nom, prixStr) {
            if(cart[id]) {
                cart[id].qty += 1;
            } else {
                cart[id] = { nom: nom, prix: parsePrice(prixStr), prixStr: prixStr, qty: 1 };
            }
            updateCartUI();
        }

        function removeFromCart(id) {
            if(cart[id]) {
                cart[id].qty -= 1;
                if(cart[id].qty <= 0) { delete cart[id]; }
                updateCartUI();
            }
        }

        function clearCart() {
            cart = {};
            toggleCartModal();
            updateCartUI();
        }

        function updateCartUI() {
            let totalQty = 0;
            let totalPrice = 0;
            let listHtml = "";

            for(let id in cart) {
                let item = cart[id];
                totalQty += item.qty;
                totalPrice += item.prix * item.qty;
                
                listHtml += `
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <div>
                        <div class="font-bold">`+item.nom+`</div>
                        <div class="text-sm text-gray-500">`+item.prixStr+`</div>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="removeFromCart('`+id+`')" class="bg-red-100 text-red-600 rounded-full w-8 h-8 font-bold">-</button>
                        <span class="font-bold w-4 text-center">`+item.qty+`</span>
                        <button onclick="addToCart('`+id+`', '`+item.nom+`', '`+item.prixStr+`')" class="bg-green-100 text-green-600 rounded-full w-8 h-8 font-bold">+</button>
                    </div>
                </div>`;
            }

            document.getElementById('cart-count').innerText = totalQty;
            document.getElementById('cart-total').innerText = totalPrice;
            document.getElementById('modal-cart-total').innerText = totalPrice;
            document.getElementById('cart-items-list').innerHTML = listHtml;

            let cartBar = document.getElementById('cart-bar');
            if(totalQty > 0) { cartBar.classList.add('visible'); } 
            else { cartBar.classList.remove('visible'); }
        }

        function toggleCartModal() {
            let modal = document.getElementById('cart-modal');
            if(modal.classList.contains('visible')) { modal.classList.remove('visible'); } 
            else { if(Object.keys(cart).length > 0) modal.classList.add('visible'); }
        }

        function sendOrderToWhatsApp() {
            let message = "🏄‍♂️ *NOUVELLE COMMANDE SNACK & SURF*\n\n";
            let totalPrice = 0;
            
            for(let id in cart) {
                let item = cart[id];
                let itemTotal = item.prix * item.qty;
                totalPrice += itemTotal;
                message += "▫️ " + item.qty + "x " + item.nom + " (" + itemTotal + " FCFA)\n";
            }
            message += "\n💰 *TOTAL : " + totalPrice + " FCFA*";
            message += "\n\n_Pouvez-vous preparer cette commande s'il vous plait ?_";
            
            let waLink = "https://wa.me/221710579371?text=" + encodeURIComponent(message);
            window.open(waLink, '_blank');
            toggleCartModal();
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/menu').then(response => response.json()).then(data => {
                const container = document.getElementById('dynamic-menu-container');
                data.forEach(categorie => {
                    let html = `<div class="text-center mb-8"><h2 class="section-title uppercase">`+categorie.categorie+`</h2><div class="space-y-2">`;
                    categorie.items.forEach(item => {
                        let descHtml = item.desc ? `<p class="item-ingredients text-left bg-[#fffde7] border-l-4 border-[#FDEF42] p-2 mt-1 mb-2 rounded-r">`+item.desc+`</p>` : '';
                        // Nouveau bouton PLUS pour ajouter au panier
                        let addBtn = `<button onclick="addToCart('`+item.id+`', '`+item.nom.replace(/'/g, "\\'")+`', '`+item.prix+`')" class="btn-add">+</button>`;
                        
                        html += `<div class="menu-item-block"><div class="item-row"><div class="item-name-dots"><span class="item-name uppercase text-left">`+item.nom+`</span><div class="dots-separator"></div></div><div class="flex items-center"><span class="item-price">`+item.prix+`</span>`+addBtn+`</div></div>`+descHtml+`</div>`;
                    });
                    html += `</div></div>`;
                    container.innerHTML += html;
                });
            });
        });
    </script>
</body>
</html>

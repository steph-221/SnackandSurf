<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Snack and Surf | Restaurant de plage & Burgers - Almadies, Dakar</title>
    <meta name="description" content="Snack de plage aux Almadies a Dakar. Degustez nos burgers maison, hot-dogs crispy, crepes et smoothies face a l'ocean. Privatisation jusqu'a 30 personnes.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        :root {
            --senegal-green: #00853F;
            --senegal-yellow: #FDEF42;
            --senegal-red: #E31B23;
            --text-dark: #1a1a1a;
            --text-muted: #555555;
        }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #e0f7fa 0%, #80deea 100%); background-attachment: fixed; min-height: 100vh; color: var(--text-dark); }
        .main-title { font-family: 'Permanent Marker', cursive; text-shadow: 2px 2px 0px var(--senegal-green); color: var(--senegal-red); transform: rotate(-2deg); }
        .card { background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0, 133, 63, 0.15); padding: 2rem 1.5rem; margin: 2rem auto; max-width: 750px; border: 2px solid #fff; position: relative; overflow: hidden; }
        .card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 12px; background: repeating-linear-gradient(90deg, var(--senegal-green), var(--senegal-green) 33.3%, var(--senegal-yellow) 33.3%, var(--senegal-yellow) 66.6%, var(--senegal-red) 66.6%, var(--senegal-red) 100%); }
        .section-title { font-family: 'Permanent Marker', cursive; position: relative; color: var(--senegal-green); font-size: 2rem; padding-bottom: 1rem; display: flex; align-items: center; justify-content: center; margin-top: 2rem; }
        .section-title::after { content: ''; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 80px; height: 4px; background-color: var(--senegal-yellow); border-radius: 2px; box-shadow: 0 2px 0 var(--senegal-red); }
        .menu-item-block { padding-top: 0.75rem; border-bottom: 1px dashed #ccc; padding-bottom: 0.5rem;}
        .item-row { display: flex; justify-content: space-between; align-items: flex-end; }
        .item-name-dots { display: flex; flex-grow: 1; overflow: hidden; align-items: flex-end; }
        .dots-separator { flex-grow: 1; min-width: 10px; margin: 0 0.5rem; border-bottom: 2px dotted #aaa; height: 1em; }
        .item-name { font-weight: 700; color: #222; font-size: 1.1rem; line-height: 1.4; display: block; flex-shrink: 1; }
        .item-price { font-family: 'Permanent Marker', cursive; color: var(--senegal-red); font-size: 1.25rem; flex-shrink: 0; margin-left: 1rem; }
        .item-ingredients { color: var(--text-muted); font-style: italic; font-size: 0.9rem; margin-top: 0.25rem; margin-bottom: 0.75rem; padding-left: 0.5rem; line-height: 1.3; }
        
        /* Style du bouton Commander */
        .btn-commander {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background-color: #25D366; /* Vert WhatsApp */
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 9999px;
            margin-left: 10px;
            text-decoration: none;
            transition: transform 0.2s;
            flex-shrink: 0;
            margin-bottom: 4px;
        }
        .btn-commander:hover { transform: scale(1.05); }
        .btn-commander svg { width: 14px; height: 14px; fill: currentColor; }

        @media (max-width: 640px) { .section-title { font-size: 1.75rem; } }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div class="fixed top-4 left-4 z-50 flex gap-2">
        <a href="/admin" class="bg-gray-800 text-white text-xs font-bold px-3 py-2 rounded opacity-50 hover:opacity-100 transition">Admin</a>
        <a href="/privatisation" class="bg-blue-600 text-white text-xs font-bold px-3 py-2 rounded shadow-md">Privatiser</a>
    </div>

    <header class="text-center mb-6 mt-8">
        <h1 class="main-title text-5xl sm:text-6xl font-extrabold tracking-wider relative inline-block">LA CARTE</h1>
        <p class="text-xs uppercase tracking-widest text-emerald-800 font-bold mt-2">Route de la Corniche, Les Almadies - Dakar</p>
    </header>

    <main class="card">
        <div class="w-full flex justify-center mb-8 pt-4">
            <img src="https://drive.google.com/thumbnail?id=1ffuCBqJBhUMZF1akm5_CL7_txgfaJF2m&sz=w1000" alt="Snack and Surf Almadies Logo" class="max-w-[250px] sm:max-w-[300px] h-auto drop-shadow-md">
        </div>

        <!-- MENU DYNAMIQUE AVEC BOUTONS COMMANDER -->
        <div id="dynamic-menu-container"></div>

        <!-- SECTION CONTACT & INFOS -->
        <div class="mt-16 bg-[#FDEF42] rounded-xl p-6 shadow-inner relative overflow-hidden border-2 border-white">
            <h2 class="section-title !mt-0 mb-8 !text-gray-900 !after:bg-[var(--senegal-red)] !after:shadow-none">NOUS TROUVER</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center mb-8">
                <div class="bg-white rounded-lg p-5 shadow-sm text-center border-t-4 border-[var(--senegal-green)]">
                    <h3 class="font-bold text-xl mb-4 text-gray-800">Horaires</h3>
                    <ul class="text-sm text-gray-700 space-y-1 mb-6 inline-block text-left w-3/4 mx-auto">
                        <li class="flex justify-between"><span class="font-semibold w-12">Lun</span> <span>11h00 - 17h00</span></li>
                        <li class="flex justify-between"><span class="font-semibold w-12">Mar</span> <span>11h00 - 20h00</span></li>
                        <li class="flex justify-between"><span class="font-semibold w-12">Mer</span> <span>11h00 - 20h00</span></li>
                        <li class="flex justify-between"><span class="font-semibold w-12">Jeu</span> <span>11h00 - 20h00</span></li>
                        <li class="flex justify-between"><span class="font-semibold w-12">Ven</span> <span>11h00 - 21h00</span></li>
                        <li class="flex justify-between"><span class="font-semibold w-12">Sam</span> <span>09h00 - 22h00</span></li>
                        <li class="flex justify-between text-red-600"><span class="font-semibold w-12">Dim</span> <span>Ferme</span></li>
                    </ul>
                    <hr class="my-4 border-gray-200">
                    <h3 class="font-bold text-lg mb-2 text-gray-800">Contact</h3>
                    <p class="text-sm font-semibold mb-1">📞 +221 71 057 93 71</p>
                    <p class="text-sm text-gray-600 mb-4">✉️ contact@snackandsurf.sn</p>
                </div>

                <div class="rounded-lg overflow-hidden shadow-md border-4 border-white h-full min-h-[250px]">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15433.00318042456!2d-17.5140685!3d14.7435384!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTTCsDQ0JzM2LjciTiAxN8KwMzAnNTAuNiJX!5e0!3m2!1sfr!2ssn!4v1690000000000!5m2!1sfr!2ssn" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </div>

        <div class="w-full mt-12 mb-6 rounded-xl overflow-hidden shadow-lg border-4 border-white">
            <img src="https://drive.google.com/thumbnail?id=1SJEYqCftp8I90e15AeBH2guhAsDHwh3x&sz=w1000" alt="Restaurant Snack and Surf aux Almadies" class="w-full h-auto object-cover">
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/menu').then(response => response.json()).then(data => {
                const container = document.getElementById('dynamic-menu-container');
                data.forEach(categorie => {
                    let html = `<div class="text-center mb-8"><h2 class="section-title uppercase">`+categorie.categorie+`</h2><div class="space-y-2">`;
                    
                    categorie.items.forEach(item => {
                        let descHtml = item.desc ? `<p class="item-ingredients text-left bg-[#fffde7] border-l-4 border-[#FDEF42] p-2 mt-1 mb-2 rounded-r">`+item.desc+`</p>` : '';
                        
                        // Encodage du message WhatsApp
                        let waMessage = encodeURIComponent("Bonjour Snack & Surf ! Je souhaite commander : " + item.nom + " (" + item.prix + ").");
                        let waLink = "https://wa.me/221710579371?text=" + waMessage;
                        
                        // Ajout du bouton dans le HTML de l'item
                        html += `
                        <div class="menu-item-block">
                            <div class="item-row">
                                <div class="item-name-dots">
                                    <span class="item-name uppercase">`+item.nom+`</span>
                                    <div class="dots-separator"></div>
                                </div>
                                <span class="item-price">`+item.prix+`</span>
                                <a href="`+waLink+`" target="_blank" class="btn-commander" title="Commander sur WhatsApp">
                                    <svg viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.599 2.679-.702c.97.529 1.838.783 2.78.783h.001c3.182 0 5.768-2.587 5.769-5.766.001-3.182-2.585-5.767-5.769-5.767zm7.551 5.766c-.001 4.165-3.39 7.554-7.553 7.554-1.259 0-2.438-.328-3.486-.902l-4.543 1.19 1.213-4.431c-.655-1.084-1.024-2.353-1.024-3.411.001-4.165 3.39-7.554 7.553-7.554 4.164 0 7.553 3.389 7.554 7.554zm-4.708 2.062c-.21-.105-1.242-.613-1.434-.683-.193-.07-.333-.105-.473.105-.14.21-.543.683-.666.823-.122.14-.245.158-.455.053-.21-.105-.888-.327-1.691-1.043-.625-.558-1.047-1.247-1.17-1.457-.122-.21-.013-.324.092-.428.095-.094.21-.245.315-.368.105-.123.14-.21.21-.35.07-.14.035-.263-.018-.368-.053-.105-.473-1.14-.648-1.56-.17-.41-.344-.354-.473-.36-.122-.006-.263-.007-.403-.007-.14 0-.368.053-.56.263-.193.21-.736.719-.736 1.753s.753 2.033.858 2.173c.105.14 1.482 2.263 3.59 3.173.501.217.892.346 1.197.443.503.16 1.012.137 1.393.08.425-.064 1.242-.508 1.417-.999.175-.49.175-.91.122-.999-.052-.088-.192-.14-.402-.245z"/></svg>
                                    +
                                </a>
                            </div>
                            `+descHtml+`
                        </div>`;
                    });
                    
                    html += `</div></div>`;
                    container.innerHTML += html;
                });
            });
        });
    </script>
</body>
</html>

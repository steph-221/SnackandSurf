<!DOCTYPE html><html lang='fr'><head><meta charset='UTF-8'><title>Gestion Carte</title><script src='https://cdn.tailwindcss.com'></script></head>
<body class='bg-gray-100 p-8 font-sans'><div class='max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md'><div class='flex justify-between items-center mb-6'><h1 class='text-3xl font-bold text-blue-600'>Gestion de la Carte</h1><a href='/admin/logout' class='text-red-500 hover:underline'>Déconnexion</a></div><div class='bg-blue-50 p-4 rounded mb-8 border border-blue-200'><h2 class='font-bold text-lg mb-4'>Ajouter un plat</h2><form action='/admin/ajouter' method='POST' class='grid grid-cols-2 gap-4'><input type='text' name='categorie' placeholder='Catégorie' class='border p-2 rounded' required><input type='text' name='nom' placeholder='Nom du plat' class='border p-2 rounded' required><input type='text' name='prix' placeholder='Prix (ex: 4000 FCFA)' class='border p-2 rounded' required><input type='text' name='description' placeholder='Description' class='border p-2 rounded col-span-2'><button type='submit' class='bg-green-500 text-white px-4 py-2 rounded font-bold col-span-2'>Ajouter</button></form></div><h2 class='font-bold text-lg mb-4'>Plats actuels</h2><table class='w-full text-left border-collapse'><thead><tr class='bg-gray-200'><th class='p-2 border'>Catégorie</th><th class='p-2 border'>Nom</th><th class='p-2 border'>Prix</th><th class='p-2 border'>Action</th></tr></thead><tbody>{% for plat in plats %}<tr><td class='p-2 border'>{{ plat.categorie }}</td><td class='p-2 border font-bold'>{{ plat.nom }}</td><td class='p-2 border'>{{ plat.prix }}</td><td class='p-2 border text-center'><form action='/admin/supprimer/{{ plat.id }}' method='POST' onsubmit='return confirm("Supprimer ?");'><button type='submit' class='bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600'>Supprimer</button></form></td></tr>{% endfor %}</tbody></table><div class='mt-8 text-center'><a href='/' class='text-blue-500 underline'>Retourner au site public</a></div></div></body></html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Administration - Snack & Surf</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 border border-gray-100">
        <div class="text-center mb-8">
            <span class="text-4xl">🏄‍♂️</span>
            <h1 class="text-2xl font-bold text-gray-800 mt-2">Administration</h1>
            <p class="text-sm text-gray-500">Snack & Surf - Almadies</p>
        </div>

        <form action="/admin" method="POST" class="space-y-5">
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Mot de passe</label>
                <input type="password" id="password" name="password" required autofocus
                    placeholder="Entrez le mot de passe admin"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition">
                Se connecter
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/" class="text-sm text-gray-500 hover:text-blue-600 transition">← Retour au site</a>
        </div>
    </div>
</body>
</html>
